<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thanh toán thành công — CV Builder Pro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <style>
    body { background:#f1f5f9; display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .card { max-width:440px; width:100%; border:none; border-radius:16px; box-shadow:0 8px 32px rgba(0,0,0,.12); }
    .icon-ok  { font-size:4rem; color:#10b981; animation:pop .4s ease; }
    .icon-err { font-size:4rem; color:#ef4444; }
    .icon-spin{ font-size:3rem; color:#6366f1; animation:spin 1s linear infinite; }
    @keyframes pop  { 0%{transform:scale(0)} 80%{transform:scale(1.2)} 100%{transform:scale(1)} }
    @keyframes spin { to{transform:rotate(360deg)} }
    .btn-home { background:linear-gradient(135deg,#1d4ed8,#7c3aed); color:#fff; border:none;
                border-radius:8px; padding:11px 24px; font-weight:700; width:100%; }
    .btn-home:hover { opacity:.88; color:#fff; }
  </style>
</head>
<body>
<div class="card p-5 text-center">

  <div id="stateLoading">
    <i class="bi bi-arrow-repeat icon-spin d-block mb-3"></i>
    <h5>Đang xác minh thanh toán…</h5>
  </div>

  <div id="stateSuccess" style="display:none">
    <i class="bi bi-check-circle-fill icon-ok d-block mb-3"></i>
    <h4 class="fw-bold mb-1">Thanh toán thành công! 🎉</h4>
    <p class="text-muted mb-4">Tài khoản <strong>Premium</strong> đã kích hoạt.<br>Xuất PDF không giới hạn, không watermark.</p>
    <a href="/" class="btn-home text-decoration-none d-block">Quay lại tạo CV →</a>
  </div>

  <div id="stateFail" style="display:none">
    <i class="bi bi-x-circle-fill icon-err d-block mb-3"></i>
    <h4 class="fw-bold mb-1">Thanh toán chưa hoàn tất</h4>
    <p class="text-muted mb-4">Đơn hàng chưa được thanh toán hoặc đã bị huỷ.</p>
    <a href="/" class="btn-home text-decoration-none d-block">← Thử lại</a>
  </div>

</div>
<script>
  // PayOS appends ?orderCode=xxx&status=PAID to the returnUrl
  const params    = new URLSearchParams(location.search);
  const orderCode = params.get('orderCode');
  const status    = (params.get('status') || '').toUpperCase();

  async function verify() {
    if (status === 'PAID') { markSuccess(); return; }

    if (orderCode) {
      try {
        const res  = await fetch('/api/payment/verify?orderCode=' + orderCode);
        const data = await res.json();
        if (data.paid) { markSuccess(); return; }
      } catch (_) {}
    }

    show('stateFail');
  }

  function markSuccess() {
    // Activate premium in localStorage — main app reads this on next load
    localStorage.setItem('cvbPremium_v1', '1');
    show('stateSuccess');
  }

  function show(id) {
    document.getElementById('stateLoading').style.display = 'none';
    document.getElementById(id).style.display = '';
  }

  verify();
</script>
</body>
</html>
