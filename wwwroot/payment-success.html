<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thanh toán thành công — CV Builder Pro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <style>
    body { background:#f1f5f9; display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .card { max-width:440px; width:100%; border:none; border-radius:16px; box-shadow:0 8px 32px rgba(0,0,0,.12); }
    .icon-ok  { font-size:4rem; color:#10b981; animation:pop .4s ease; }
    .icon-err { font-size:4rem; color:#ef4444; }
    .icon-spin{ font-size:3rem; color:#6366f1; animation:spin 1s linear infinite; }
    @keyframes pop  { 0%{transform:scale(0)} 80%{transform:scale(1.2)} 100%{transform:scale(1)} }
    @keyframes spin { to{transform:rotate(360deg)} }
    .btn-home { background:linear-gradient(135deg,#1d4ed8,#7c3aed); color:#fff; border:none;
                border-radius:8px; padding:11px 24px; font-weight:700; width:100%; }
    .btn-home:hover { opacity:.88; color:#fff; }
  </style>
</head>
<body>
<div class="card p-5 text-center">

  <div id="stateLoading">
    <i class="bi bi-arrow-repeat icon-spin d-block mb-3"></i>
    <h5>Đang xác minh thanh toán…</h5>
  </div>

  <div id="stateSuccess" style="display:none">
    <i class="bi bi-check-circle-fill icon-ok d-block mb-3"></i>
    <h4 class="fw-bold mb-1" id="successTitle">Thanh toán thành công! 🎉</h4>
    <p class="text-muted mb-4" id="successDesc">Tài khoản đã được kích hoạt.</p>
    <a href="/" class="btn-home text-decoration-none d-block">Quay lại tạo CV →</a>
  </div>

  <div id="stateFail" style="display:none">
    <i class="bi bi-x-circle-fill icon-err d-block mb-3"></i>
    <h4 class="fw-bold mb-1">Thanh toán chưa hoàn tất</h4>
    <p class="text-muted mb-4">Đơn hàng chưa được thanh toán hoặc đã bị huỷ.</p>
    <a href="/" class="btn-home text-decoration-none d-block">← Thử lại</a>
  </div>

</div>
<script>
  const STORAGE_KEY_JWT = 'cvbJwt';

  // PayOS appends ?orderCode=xxx&status=PAID to the returnUrl.
  // IMPORTANT: We never trust the URL params directly — always verify with the backend.
  const params    = new URLSearchParams(location.search);
  const orderCode = params.get('orderCode');

  // Retrieve plan stored in sessionStorage before the PayOS redirect
  const plan = sessionStorage.getItem('cvbPaymentPlan') || 'pro';

  function authHeaders() {
    const token = localStorage.getItem(STORAGE_KEY_JWT);
    return token ? { 'Authorization': `Bearer ${token}` } : {};
  }

  async function verify() {
    if (!orderCode) { show('stateFail'); return; }

    try {
      const res = await fetch('/api/payment/verify?orderCode=' + encodeURIComponent(orderCode), {
        headers: authHeaders(),
      });
      if (!res.ok) throw new Error('verify failed');
      const data = await res.json();
      if (data.paid) { await markSuccess(plan); return; }
    } catch (_) {}

    show('stateFail');
  }

  async function markSuccess(activatedPlan) {
    sessionStorage.removeItem('cvbPaymentPlan');

    // Refresh JWT — server has already upgraded the plan in DB
    // Re-fetch user so future page loads get the correct plan from the server
    try {
      const meRes = await fetch('/api/auth/me', { headers: authHeaders() });
      if (meRes.ok) {
        // The fresh plan comes from the DB via JWT — no localStorage needed
        // Just ensure the old premium localStorage keys are cleared
        localStorage.removeItem('cvbPremium_v1');
        localStorage.removeItem('cvbPlan_v1');
      }
    } catch (_) {}

    const planLabel = activatedPlan === 'business' ? 'Business' : 'Pro';
    document.getElementById('successTitle').textContent = `Kích hoạt ${planLabel} thành công! 🎉`;
    document.getElementById('successDesc').innerHTML =
      `Tài khoản <strong>${planLabel}</strong> đã được kích hoạt.<br>Xuất PDF không giới hạn, không watermark.`;

    show('stateSuccess');
  }

  function show(id) {
    document.getElementById('stateLoading').style.display = 'none';
    document.getElementById(id).style.display = '';
  }

  verify();
</script>
</body>
</html>
