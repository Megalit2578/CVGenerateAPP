<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đã huỷ thanh toán — CV Builder Pro</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <style>
    body { background: #f1f5f9; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card-wrap { background: #fff; border-radius: 16px; padding: 48px 40px; max-width: 460px; width: 100%; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,.08); }
    .icon-circle { width: 80px; height: 80px; border-radius: 50%; background: #fef9c3; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; font-size: 2.2rem; color: #ca8a04; }
    h2 { font-weight: 700; color: #0f172a; margin-bottom: 8px; }
    p { color: #64748b; }
    .btn-home { background: #1d4ed8; color: #fff; border: none; border-radius: 8px; padding: 12px 28px; font-weight: 600; font-size: 1rem; cursor: pointer; text-decoration: none; display: inline-block; margin-top: 20px; }
    .btn-home:hover { background: #1e40af; color: #fff; }
  </style>
</head>
<body>
  <div class="card-wrap">
    <div class="icon-circle"><i class="bi bi-x-circle"></i></div>
    <h2>Đã huỷ thanh toán</h2>
    <p>Bạn đã huỷ giao dịch. Không có khoản tiền nào bị trừ.<br>Bạn có thể thử lại bất cứ lúc nào.</p>
    <a href="/" class="btn-home"><i class="bi bi-arrow-left me-2"></i>Quay về trang chủ</a>
  </div>
</body>
</html>
